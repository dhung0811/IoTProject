services:
  api:
    build: ./backend
    ports:
      - "${API_PORT}:8000"
    environment:
      TZ: ${TZ}
      RABBITMQ_URL: ${RABBITMQ_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${DASHBOARD_PORT}:3000"
    environment:
      TZ: ${TZ}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NODE_OPTIONS: --max-old-space-size=224
    depends_on:
      - websocket-gateway
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  websocket-gateway:
    build: ./websocket-gateway
    ports:
      - "${WEBSOCKET_PORT}:8080"
    environment:
      TZ: ${TZ}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  stream-processor:
    build: ./stream-processor
    environment:
      TZ: ${TZ}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    environment:
      TZ: ${TZ}
      # Tell RabbitMQ to flow-control at 70% of its container limit (256m * 0.7 ≈ 179m)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.7"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  influxdb:
    image: influxdb:2.7-alpine
    ports:
      - "${INFLUXDB_PORT}:8086"
    environment:
      TZ: ${TZ}
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_INIT_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 384m
        reservations:
          memory: 192m

volumes:
  influxdb_data:
