global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: websocket-gateway
    static_configs:
      - targets: ["websocket-gateway:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
